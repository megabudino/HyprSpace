name: Update Cask Formula

on:
  repository_dispatch:
    types: [update-cask]
  schedule:
    # Check for updates every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-cask:
    runs-on: macos-latest
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest release info
        id: release
        run: |
          # Get the latest release from the main repository
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/BarutSRB/HyprSpace/releases/latest)
          VERSION=$(echo "$LATEST_RELEASE" | jq -r '.tag_name' | sed 's/^v//')
          DOWNLOAD_URL=$(echo "$LATEST_RELEASE" | jq -r '.assets[] | select(.name | contains(".zip") and contains("HyprSpace-v")) | .browser_download_url' | head -1)

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "No release found"
            exit 0
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"
          echo "Download URL: $DOWNLOAD_URL"

      - name: Check if update is needed
        id: check
        run: |
          CURRENT_VERSION=$(grep -E '^\s*version' Casks/hyprspace.rb | sed 's/.*"\(.*\)".*/\1/')
          NEW_VERSION="${{ steps.release.outputs.version }}"

          if [ "$CURRENT_VERSION" = "$NEW_VERSION" ]; then
            echo "Version $NEW_VERSION is already up to date"
            echo "needs_update=false" >> $GITHUB_OUTPUT
          else
            echo "Updating from $CURRENT_VERSION to $NEW_VERSION"
            echo "needs_update=true" >> $GITHUB_OUTPUT
          fi

      - name: Download and calculate SHA256
        if: steps.check.outputs.needs_update == 'true'
        id: sha256
        run: |
          DOWNLOAD_URL="${{ steps.release.outputs.download_url }}"
          VERSION="${{ steps.release.outputs.version }}"

          # Download the release
          curl -L -o "HyprSpace-v$VERSION.zip" "$DOWNLOAD_URL"

          # Calculate SHA256
          SHA256=$(shasum -a 256 "HyprSpace-v$VERSION.zip" | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA256"

          # Clean up
          rm "HyprSpace-v$VERSION.zip"

      - name: Update Cask formula
        if: steps.check.outputs.needs_update == 'true'
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          SHA256="${{ steps.sha256.outputs.sha256 }}"

          # Update version
          sed -i '' "s/version \".*\"/version \"$VERSION\"/" Casks/hyprspace.rb

          # Update SHA256
          sed -i '' "s/sha256 .*/sha256 \"$SHA256\"/" Casks/hyprspace.rb

          echo "Updated formula to version $VERSION with SHA256 $SHA256"

      - name: Test Cask formula
        if: steps.check.outputs.needs_update == 'true'
        run: |
          # Install Homebrew if not present
          if ! command -v brew &> /dev/null; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

          # Audit the cask
          brew audit --cask ./Casks/hyprspace.rb || true

      - name: Commit and push changes
        if: steps.check.outputs.needs_update == 'true'
        run: |
          VERSION="${{ steps.release.outputs.version }}"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add Casks/hyprspace.rb
          git commit -m "Update HyprSpace to version $VERSION"
          git push

      - name: Create Pull Request
        if: steps.check.outputs.needs_update == 'true' && github.event_name == 'schedule'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update HyprSpace to version ${{ steps.release.outputs.version }}"
          title: "Update HyprSpace to version ${{ steps.release.outputs.version }}"
          body: |
            This PR updates HyprSpace to version ${{ steps.release.outputs.version }}.

            ## Changes
            - Updated version to ${{ steps.release.outputs.version }}
            - Updated SHA256 checksum

            ## Release Notes
            View the full release notes at: https://github.com/BarutSRB/HyprSpace/releases/tag/v${{ steps.release.outputs.version }}

            ---
            *This PR was automatically generated by the update-cask workflow.*
          branch: update-hyprspace-${{ steps.release.outputs.version }}
          delete-branch: true